[project]
name = "draftsense-backend"
version = "0.1.0"
description = "DraftSense — API de etiquetado crowdsourced de campeones de League of Legends"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "psycopg[binary]>=3.2",
]

[project.scripts]
draftsense = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
# Alembic genera módulos sin anotaciones; no aportan nada al chequeo de tipos.
exclude = "migrations/versions/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
