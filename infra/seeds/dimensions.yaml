# Las 8 dimensiones funcionales del tipo de pregunta 1.
#
# Agregar una dimensión es agregar una entrada acá y recargar el seed: no requiere migración
# ni despliegue (RF-603, CA-601). Los campos `_es` son el español de la semana 8 (ADR-028),
# aprobado por el alumno el 29/10/2026; los términos del juego quedan en inglés (ADR-010).

- code: engage
  display_order: 1
  label_en: Engage
  description_en: Starting fights on your terms.
  prompt_en: Who has more engage?
  label_es: Engage
  description_es: Iniciar peleas en tus propios términos.
  prompt_es: "¿Quién tiene más engage?"

- code: poke
  display_order: 2
  label_en: Poke
  description_en: Chipping enemies down from range without committing.
  prompt_en: Who has more poke?
  label_es: Poke
  description_es: Desgastar a los enemigos a distancia sin comprometerse.
  prompt_es: "¿Quién tiene más poke?"

- code: pick
  display_order: 3
  label_en: Pick potential
  description_en: Isolating and killing a single target.
  prompt_en: Who has more pick potential?
  label_es: Potencial de pick
  description_es: Aislar y matar a un único objetivo.
  prompt_es: "¿Quién tiene más potencial de pick?"

- code: peel
  display_order: 4
  label_en: Peel
  description_en: Protecting an ally from divers and assassins.
  prompt_en: Who has more peel?
  label_es: Peel
  description_es: Proteger a un aliado de divers y asesinos.
  prompt_es: "¿Quién tiene más peel?"

- code: mobility
  display_order: 5
  label_en: Mobility
  description_en: Dashes, blinks and repositioning tools.
  prompt_en: Who has more mobility?
  label_es: Movilidad
  description_es: Dashes, blinks y herramientas para reposicionarse.
  prompt_es: "¿Quién tiene más movilidad?"

- code: scaling
  display_order: 6
  label_en: Scaling
  description_en: How much stronger they get with gold and levels.
  prompt_en: Who scales better?
  label_es: Scaling
  description_es: Cuánto más fuerte se vuelve con oro y niveles.
  prompt_es: "¿Quién escala mejor?"

- code: cc
  display_order: 7
  label_en: Crowd control
  description_en: Amount and reliability of stuns, roots and slows.
  prompt_en: Who has more crowd control?
  label_es: Control de masas
  description_es: Cantidad y fiabilidad de stuns, roots y slows.
  prompt_es: "¿Quién tiene más control de masas?"

- code: waveclear
  display_order: 8
  label_en: Waveclear
  description_en: How fast they clear minion waves.
  prompt_en: Who has better waveclear?
  label_es: Waveclear
  description_es: Qué tan rápido limpia oleadas de súbditos.
  prompt_es: "¿Quién tiene mejor waveclear?"
