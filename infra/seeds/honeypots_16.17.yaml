  expected: {choice: a}
  rationale: >
    Nami: Prisión de Agua (Q) «aturde a todos los enemigos al impacto» y Maremoto (R) «lanza por el
    aire a los enemigos». Zeri no tiene control duro: Láser Ultracargado (W) sólo ralentiza.

- champion_a: Lissandra
  champion_b: Katarina
  dimension: cc
  expected: {choice: a}
  rationale: >
    Lissandra: Anillo de Escarcha (W) congela a los enemigos cercanos «y los inmoviliza», y Tumba
    Congelada (R) deja al campeón enemigo «aturdido». Katarina no tiene ninguna habilidad de
    control.

- champion_a: Leona
  champion_b: Twitch
  dimension: cc
  expected: {choice: a}
  rationale: >
    Leona: Escudo del Amanecer (Q) aturde, Espada del Cénit (E) inmoviliza y Llamarada Solar (R)
    aturde. Twitch no tiene control duro: Tonel de Veneno (W) sólo ralentiza.

- champion_a: Nautilus
  champion_b: Kayn
  dimension: cc
  expected: {choice: a}
  rationale: >
    Nautilus: su pasiva inmoviliza al primer objetivo que ataca y Carga de las Profundidades (R)
    lanza por el aire y aturde. Kayn no tiene control duro: Alcance de Cuchilla (W) sólo ralentiza.

- champion_a: Lissandra
  champion_b: Yunara
  dimension: cc
  expected: {choice: a}
  rationale: >
    Lissandra: Anillo de Escarcha (W) inmoviliza y Tumba Congelada (R) aturde. Yunara no tiene
