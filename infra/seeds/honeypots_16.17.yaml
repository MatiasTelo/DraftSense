# Catálogo de honeypots del parche 16.17 — docs/22-calidad-de-datos.md §3, ADR-013.
#
# Aprobado por el alumno el 16/09/2026. **Falta la revisión de Marinozi**, que tiene que hacerse
# antes del lanzamiento cerrado de la semana 7 (22 §3.3): la revisión no opina sobre la respuesta,
# verifica que cada `rationale` describa lo que la habilidad efectivamente hace.
#
# Se carga con `python -m app.cli seed-honeypots --patch 16.17`.
#
# Fuente de cada `rationale`: el JSON por campeón de Data Dragon, versión 16.17.1, locale es_AR
# (https://ddragon.leagueoflegends.com/cdn/16.17.1/data/es_AR/champion/<Clave>.json). Las citas
# entre comillas son el texto de la habilidad tal como lo publica Riot. «Ninguna habilidad» quiere
# decir que no aparece en la pasiva ni en Q, W, E o R de ese mismo archivo.
#
# Reglas del catálogo (22 §3.2 y nota del 16/09 en §3.3):
# - sólo campeones de tier 1 y sólo las seis dimensiones que admite ADR-013;
# - champion_a es el que tiene más de la dimensión, y `expected` es siempre {choice: a}; la carga
#   ordena el par según champion_id e invierte la respuesta si hace falta;
# - `waveclear` no tiene pares: ningún campeón del tier 1 tiene sólo daño de objetivo único
#   (nota del 16/09 en 22 §3.2).

# --- mobility: uno tiene dash, salto o parpadeo; el otro ninguna habilidad de desplazamiento ---

- champion_a: Ezreal
  champion_b: Jinx
  dimension: mobility
  expected: {choice: a}
  rationale: >
    Ezreal, E (Desplazamiento Arcano): «Ezreal se teletransporta a una ubicación cercana». Jinx no
    tiene ninguna habilidad que la desplace: su pasiva y ¡Cambio de Armas! sólo le dan velocidad de
    movimiento o de ataque.

- champion_a: Lucian
  champion_b: Ashe
  dimension: mobility
  expected: {choice: a}
  rationale: >
    Lucian, E (Persecución Implacable): «Lucian se desplaza una corta distancia». Ashe no tiene
    ninguna habilidad de desplazamiento; su E (Tiro de Halcón) envía un halcón a explorar.

- champion_a: Tristana
  champion_b: Miss Fortune
  dimension: mobility
  expected: {choice: a}
  rationale: >
    Tristana, W (Salto Cohete): «dispara al suelo para propulsarse hasta un punto lejano». Miss
    Fortune no tiene ninguna habilidad de desplazamiento; Alarde (W) sólo le da velocidad de
    movimiento.

- champion_a: LeBlanc
  champion_b: Syndra
  dimension: mobility
  expected: {choice: a}
  rationale: >
    LeBlanc, W (Distorsión): «LeBlanc se desplaza hacia una ubicación». Syndra no tiene ninguna
    habilidad que la desplace: Fuerza de Voluntad (W) y Dispersar a los Débiles (E) mueven esferas,
    súbditos o enemigos, no a ella.

- champion_a: Aatrox
  champion_b: Garen
  dimension: mobility
  expected: {choice: a}
  rationale: >
    Aatrox, E (Impulso Siniestro): «Al activarlo, se desplaza en una dirección». Garen no tiene
    ninguna habilidad de desplazamiento; Golpe Decisivo (Q) sólo le da velocidad de movimiento.

- champion_a: Pyke
  champion_b: Milio
  dimension: mobility
  expected: {choice: a}
  rationale: >
    Pyke, E (Corriente Fantasma): «Pyke se desplaza y deja atrás a un fantasma». Milio no tiene
    ninguna habilidad que lo desplace; sus habilidades patean una pelota, curan o escudan aliados.

- champion_a: Kai'Sa
  champion_b: Viktor
  dimension: mobility
  expected: {choice: a}
  rationale: >
    Kai'Sa, R (Instinto Asesino): «Kai'Sa se desplaza cerca de un campeón enemigo». Viktor no tiene
    ninguna habilidad de desplazamiento; el aumento de Transferencia de Potencia (Q) sólo le da
    velocidad de movimiento.

- champion_a: Zed
  champion_b: Karma
  dimension: mobility
  expected: {choice: a}
  rationale: >
    Zed, R (Marca de la Muerte): «se desplaza hacia un campeón enemigo»; con W (Sombra Viviente)
    «Zed cambie de posición con esta sombra». Karma no tiene ninguna habilidad de desplazamiento;
    Inspiración (E) le da a un aliado un escudo y velocidad de movimiento.

# --- cc: uno tiene dos o más habilidades de control duro; el otro ninguna ---------------------

- champion_a: Leona
  champion_b: Kai'Sa
  dimension: cc
  expected: {choice: a}
  rationale: >
    Leona: Escudo del Amanecer (Q) «aturdiendo al objetivo», Espada del Cénit (E) lo deja
    «inmovilizado brevemente» y Llamarada Solar (R) deja a los enemigos del centro «aturdidos».
    Kai'Sa no tiene ninguna habilidad que aturda, inmovilice o eleve.

- champion_a: Nautilus
  champion_b: Ezreal
  dimension: cc
  expected: {choice: a}
  rationale: >
    Nautilus: su pasiva (Golpe Maestro) «lo inmoviliza por un momento» y Carga de las Profundidades
    (R) «lanza por el aire y aturde al objetivo». Ezreal no tiene ninguna habilidad de control:
    sus hechizos sólo infligen daño.

- champion_a: Nami
  champion_b: Zeri
