# --- poke: uno es a distancia con daño de rango largo; el otro es cuerpo a cuerpo ------------
# Los tres cuerpo a cuerpo tienen un salto o una embestida que daña al llegar (Jax Q, Renekton E,
# Darius R). Eso es daño cuerpo a cuerpo, no a distancia: llega después de cerrar la distancia
# (nota del 16/09 en 22 §3.2).

- champion_a: Caitlyn
  champion_b: Jax
  dimension: poke
  expected: {choice: a}
  rationale: >
    Caitlyn ataca a distancia (alcance 650) y Pacificadora de Piltóver (Q) es un disparo
    penetrante de 1250 de alcance. Jax es cuerpo a cuerpo (alcance 125) y su único alcance extra es
    Salto Brutal (Q), que lo lleva hasta el objetivo antes de golpear.

- champion_a: Lux
  champion_b: Renekton
  dimension: poke
  expected: {choice: a}
  rationale: >
    Lux ataca a distancia (alcance 550) y Hechizo Luminoso (Q, 1175) y Singularidad Brillante
    (E, 1100) dañan desde lejos. Renekton es cuerpo a cuerpo (alcance 125): sus habilidades golpean
    a su alrededor (Q, R), a su objetivo (W) o en el camino de su embestida (E).

- champion_a: Jhin
  champion_b: Darius
  dimension: poke
  expected: {choice: a}
  rationale: >
    Jhin ataca a distancia (alcance 550) y Brote Mortal (W) dispara «una sola bala con un enorme
    alcance» (3000). Darius es cuerpo a cuerpo (alcance 175): Diezmar (Q) golpea a su alrededor y
    Guillotina Noxiana (R) lo hace saltar hasta el campeón antes de golpear.

- champion_a: Zeri
  champion_b: Jax
  dimension: poke
  expected: {choice: a}
  rationale: >
    Zeri ataca a distancia (alcance 550) y Láser Ultracargado (W, 1150) se convierte en un «láser
    de largo alcance» al tocar una pared. Jax es cuerpo a cuerpo (alcance 125) y no tiene daño a
    distancia sin saltar primero.

- champion_a: Ezreal
  champion_b: Renekton
  dimension: poke
  expected: {choice: a}
  rationale: >
    Ezreal ataca a distancia (alcance 550) y Disparo Místico (Q) y Flujo de Esencia (W) tienen 1150
    de alcance. Renekton es cuerpo a cuerpo (alcance 125) y no tiene ningún proyectil.

- champion_a: Kai'Sa
  champion_b: Darius
  dimension: poke
  expected: {choice: a}
  rationale: >
    Kai'Sa ataca a distancia (alcance 525) y Buscadora del Vacío (W) es «un misil de largo
    alcance» (3000). Darius es cuerpo a cuerpo (alcance 175) y no tiene ningún proyectil.

# --- engage: uno tiene acercamiento + control; el otro no tiene forma de iniciar --------------

- champion_a: Malphite
  champion_b: Miss Fortune
  dimension: engage
  expected: {choice: a}
  rationale: >
    Malphite, R (Fuerza Imparable): «se lanza hacia una ubicación con gran velocidad para infligir
    daño a enemigos y lanzarlos por el aire». Miss Fortune no tiene ni desplazamiento ni control
    duro: Lluvia de Plomo (E) sólo ralentiza.

- champion_a: Leona
  champion_b: Gangplank
  dimension: engage
  expected: {choice: a}
  rationale: >
    Leona, E (Espada del Cénit): inmoviliza al campeón «y Leona irá rápidamente hacia él»; además
    aturde con Q y con R. Gangplank no tiene desplazamiento ni control duro: Barril de Pólvora (E)
    y Descarga de Cañones (R) sólo ralentizan.

- champion_a: Nautilus
  champion_b: Nasus
  dimension: engage
  expected: {choice: a}
  rationale: >
    Nautilus, Q (Línea de Dragado): atrae al enemigo alcanzado o lo atrae a él hacia el terreno; R
    (Carga de las Profundidades) lanza por el aire y aturde. Nasus no tiene desplazamiento ni
    control duro: Marchitar (W) sólo ralentiza.

- champion_a: Jarvan IV
  champion_b: Miss Fortune
  dimension: engage
  expected: {choice: a}
  rationale: >
    Jarvan IV, Q (Golpe Dragón): «se desplaza hacia el Estandarte Demaciano y derriba a los
    enemigos que encuentre»; R (Cataclismo) «salta heroicamente al combate». Miss Fortune no tiene
    desplazamiento ni control duro.

- champion_a: Wukong
  champion_b: Gangplank
  dimension: engage
  expected: {choice: a}
  rationale: >
    Wukong, E (Golpe de Nimbo): «se lanza contra un enemigo»; R (Ciclón): los enemigos alcanzados
    «son lanzados por el aire». Gangplank no tiene desplazamiento ni control duro.

- champion_a: Viego
  champion_b: Nasus
  dimension: engage
  expected: {choice: a}
  rationale: >
    Viego, W (Fauces Espectrales): «carga antes de desplazarse hacia adelante» y «aturde al primer
    enemigo alcanzado». Nasus no tiene desplazamiento ni control duro.

